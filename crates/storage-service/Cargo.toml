[package]
name = "storage-service"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Internal
file-system = { path = "../file-system", default-features = false, features = ["native"] }
iroh-chain = { path = "../iroh-chain", default-features = false, features = [] }
iroh-chain-file-system = { path = "../iroh-chain-file-system", default-features = false, features = [] }
storage-model = { path = "../storage-model", default-features = false, features = ["std"] }

# Iroh
iroh = { version = "1.1", default-features = false, features = [] }

# Async
futures-core = { version = "0.3", default-features = false, features = [] }
tokio = { version = "1.53", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
# Internal
file-system = { path = "../file-system", default-features = false, features = ["in-memory"] }

# Async
tokio = { version = "1.52", default-features = false, features = [
  "rt",
  "macros",
] }
