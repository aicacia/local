[package]
name = "idp-db"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OAuth 2.x Database common utilities"

[lib]
name = "db"

[[bin]]
name = "db"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["migrate", "cli", "completions", "remote"]
cli = ["migrate", "dep:tokio", "dep:tokio-util", "dep:dotenvy", "dep:clap", "dep:cli", "dep:env_logger"]
completions = ["cli?/completions"]
migrate = ["dep:sha2", "dep:hex", "dep:chrono"]
replica = ["migrate", "dep:sync-db", "sync-db/automerge", "sync-db/in-memory"]
remote = ["libsql/remote", "libsql/tls"]

[dependencies]
# CLI
dotenvy = { version = "0.15", default-features = false, features = [
], optional = true }
clap = { version = "4.6", default-features = false, features = [
  "std",
  "derive",
  "env",
  "help",
], optional = true }
cli = { path = "../cli", default-features = false, features = [
], optional = true }

# Database
libsql = { version = "0.9", default-features = false, features = ["core"] }
sync-db = { package = "db", path = "../../../db", default-features = false, features = ["sql"], optional = true }

# Serialization
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }

# Async
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "time"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = [], optional = true }

# Utilities
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
], optional = true }
url = { version = "2.5", default-features = false, features = [] }

# Cryptography
sha2 = {  version = "0.11", default-features = false, features = [], optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"], optional = true }

# Logging
log = { version = "0.4", default-features = false, features = ["std"] }
env_logger = { version = "0.10", default-features = false, features = [], optional = true }

[dev-dependencies]
