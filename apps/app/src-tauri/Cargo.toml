[package]
name = "lidp"
version = "0.1.0"
description = "Local First Identity Provider Tauri App"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lidp"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = { version = "0.22", default-features = false, features = [] }
serde_json = "1.0"
yaml_serde = "0.10"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.16", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false, features = [] }
log = "0.4"
axum = { version = "0.8", default-features = false, features = ["ws"] }
rcgen = { version = "0.14", default-features = false, features = [
  "pem",
  "ring",
] }
rustls = { version = "0.23", default-features = false, features = [] }
tokio = { version = "1.52", default-features = false, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
getrandom = { version = "0.3", default-features = false, features = [] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
] }
iroh = { version = "1.1", default-features = false, features = ["tls-ring"] }
iroh-chain = { path = "../../../../offs/crates/iroh-chain", default-features = false, features = [] }
iroh-chain-file-system = { path = "../../../../offs/crates/iroh-chain-file-system", default-features = false, features = [] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }

db = { package = "idp-db", path = "../../../crates/db", default-features = false, features = [
  "native",
] }
management-server = { path = "../../../crates/management-server", default-features = false, features = [
] }
idp-model = { path = "../../../crates/idp-model", default-features = false, features = [
  "replica",
  "std",
] }
idp-server = { path = "../../../crates/idp-server", default-features = false, features = [
] }
bootstrap-service = { path = "../../../crates/bootstrap-service", default-features = false, features = ["std"] }
idp-service = { path = "../../../crates/idp-service", default-features = false, features = [
  "replica",
  "std",
] }
management-service = { path = "../../../crates/management-service", default-features = false, features = [
  "replica",
  "std",
] }
model = { path = "../../../crates/model", default-features = false, features = ["std"] }
file-system = { path = "../../../../offs/crates/file-system", default-features = false, features = [] }
storage-server = { path = "../../../crates/storage-server", default-features = false, features = [] }
storage-service = { path = "../../../crates/storage-service", default-features = false, features = [] }

tauri = { version = "2", default-features = false, features = [
  "tray-icon",
  "wry",
] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = { version = "2", default-features = false, features = [
  "deep-link",
] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = { version = "2", default-features = false, features = [] }
