[package]
name = "storage-service"
edition = "2024"
version.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Internal
btree-redb = { path = "../../../ofdb/crates/btree-redb", default-features = false, features = [] }
file-system = { path = "../../../offs/crates/file-system", default-features = false, features = [] }
kv = { path = "../../../ofdb/crates/kv", default-features = false, features = [] }
kv-sync = { path = "../../../ofdb/crates/kv-sync", default-features = false, features = [] }
ofdb = { path = "../../../ofdb", default-features = false, features = ["automerge", "iroh", "redb", "sql", "sync"] }
redb = { version = "4.3", default-features = false, features = ["uuid"] }
idp-model = { path = "../idp-model", default-features = false, features = ["std"] }
storage-model = { path = "../storage-model", default-features = false, features = ["std"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# OpenAPI
utoipa = { version = "5.5", default-features = false, features = ["macros"] }

# Async
tokio = { version = "1.53", default-features = false, features = ["sync"] }

[dev-dependencies]
# Async
tokio = { version = "1.52", default-features = false, features = [
  "rt",
  "macros",
] }
