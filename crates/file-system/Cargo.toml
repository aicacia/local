[package]
name = "file-system"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local-first, eventually consistent file system primitives"

[lib]
name = "file_system"

[features]
default = ["native", "in-memory"]
crypto = ["std", "dep:chacha20poly1305", "dep:getrandom"]
in-memory = ["sync"]
native = ["std", "sync"]
std = ["blake3/std"]
sync = ["std", "dep:automerge", "dep:percent-encoding", "dep:tokio"]

[dependencies]
# Metadata
# Automerge documents persist per-folder file metadata and drive metadata synchronization.
automerge = { version = "0.11", default-features = false, features = [], optional = true }
percent-encoding = { version = "2.3", default-features = false, features = [], optional = true }

# Storage
blake3 = { version = "1.8", default-features = false, features = [] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"], optional = true }
getrandom = { version = "0.3", default-features = false, features = [], optional = true }

# Async
futures-core = { version = "0.3", default-features = false, features = [] }
tokio = { version = "1.52", default-features = false, features = ["macros", "rt", "sync"], optional = true }
